<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastu Extension</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="brand">
                <h1>Mastu <span>Extension</span></h1>
                <p>Toutes les chaînes au même endroit</p>
            </div>
        </header>

        <section class="channels-section" aria-labelledby="channels-title">
            <div class="section-header">
                <h2 id="channels-title">Chaînes</h2>
                <span id="channel-count" class="channel-count">Chargement…</span>
            </div>

            <div id="channels-list" class="channels-list" aria-live="polite">
                <p class="loading-message">Chargement des chaînes…</p>
            </div>
        </section>

        <footer class="footer">
            <p id="last-update">Chargement des données…</p>
            <button id="refresh-button" type="button">Actualiser</button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
