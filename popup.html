
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mastu Extension</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="header">
            <div class="brand">
                <h1>Mastu <span>Extension</span></h1>
                <p>Retrouve toutes les chaînes de Mastu</p>
            </div>
        </header>

        <!-- TWITCH -->

        <section class="channels-section">

            <div class="section-header">
                <h2>Twitch</h2>
                <span class="platform-label twitch-label">
                    TWITCH
                </span>
            </div>

            <div id="twitch-channels" class="channels-list">
                <p class="loading-message">
                    Chargement de Twitch...
                </p>
            </div>

        </section>

        <!-- YOUTUBE -->

        <section class="channels-section">

            <div class="section-header">
                <h2>YouTube</h2>
                <span class="platform-label youtube-label">
                    YOUTUBE
                </span>
            </div>

            <div id="youtube-channels" class="channels-list">
                <p class="loading-message">
                    Chargement de YouTube...
                </p>
            </div>

        </section>

        <!-- FOOTER -->

        <footer class="footer">

            <p id="last-update">
                Chargement des données...
            </p>

            <button id="refresh-button" type="button">
                Actualiser
            </button>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
