<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mastu Extension</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <strong>Mastu Extension</strong>
    <div class="header-actions">
      <button id="notificationsButton" aria-label="Notifications">♧ <span id="unreadDot" hidden>●</span></button>
      <button id="settingsButton" aria-label="Réglages">⚙</button>
    </div>
  </header>

  <section id="notificationsPanel" class="panel" hidden>
    <h2>Notifications</h2>
    <div id="notificationsList"></div>
    <button id="markAllRead">Tout marquer comme lu</button>
  </section>

  <main>
    <section id="homePage" class="page">
      <h1>Accueil</h1>
      <section class="section">
        <h2>Annonce</h2>
        <article id="announcement" class="announcement">Chargement…</article>
      </section>
      <section class="section">
        <h2>En ce moment</h2>
        <div id="currentMedia">Chargement…</div>
      </section>
    </section>

    <section id="channelsPage" class="page" hidden>
      <h1>Chaînes</h1>
      <div id="channelsList">Chargement…</div>
    </section>

    <section id="settingsPage" class="page" hidden>
      <h1>Réglages</h1>
      <label><input type="checkbox" id="desktopNotifications"> Notifications Chrome</label>
      <label><input type="checkbox" id="autoClaim"> Récupérer automatiquement les bonus Twitch</label>
      <label><input type="checkbox" id="hidePlayer"> Masquer le lecteur Twitch sur Mastu</label>
      <label><input type="checkbox" id="darkMode" checked> Mode sombre</label>
      <p class="hint">Les options Twitch s'appliquent sur twitch.tv/mastu. La récupération automatique est expérimentale.</p>
      <button id="saveSettings">Enregistrer</button>
      <p id="settingsStatus" role="status"></p>
    </section>
  </main>

  <nav class="navbar" aria-label="Navigation principale">
    <button data-page="homePage" class="active">Accueil</button>
    <button data-page="channelsPage">Chaînes</button>
    <button data-page="settingsPage">Réglages</button>
  </nav>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
